<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кошик — EcoFresh</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Eco<span>Fresh</span></a>
      <button class="menu-toggle" aria-label="Меню">☰</button>
      <nav class="nav">
        <a href="/">Головна</a>
        <a href="/catalog.html">Каталог</a>
        <a href="/account.html">Кабінет</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" onclick="location.href='/cart.html'" aria-label="Кошик">
          🛒 <span class="cart-badge" style="display:none">0</span>
        </button>
        <button class="user-btn" aria-label="Профіль">👤</button>
      </div>
    </div>
  </header>

  <main>
    <h1 style="margin-bottom:1.25rem">Кошик</h1>
    <div class="cart-layout">
      <div id="cart-list"></div>
      <aside class="cart-summary" id="cart-summary" style="display:none">
        <h3>Підсумок</h3>
        <div class="summary-row"><span>Товари</span><span id="subtotal">0 ₴</span></div>
        <div class="summary-row"><span>Доставка</span><span id="delivery">0 ₴</span></div>
        <div class="summary-row total"><span>Разом</span><span id="total">0 ₴</span></div>
        <a href="/checkout.html" class="btn btn-primary btn-block" style="margin-top:1rem">Оформити замовлення</a>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2026 EcoFresh</div>
  </footer>
  <script src="/js/main.js"></script>
</body>
</html>
