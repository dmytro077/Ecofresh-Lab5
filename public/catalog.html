<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — EcoFresh</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Eco<span>Fresh</span></a>
      <button class="menu-toggle" aria-label="Меню">☰</button>
      <nav class="nav">
        <a href="/">Головна</a>
        <a href="/catalog.html" class="active">Каталог</a>
        <a href="/account.html">Кабінет</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" onclick="location.href='/cart.html'" aria-label="Кошик">
          🛒 <span class="cart-badge" style="display:none">0</span>
        </button>
        <button class="user-btn" aria-label="Профіль">👤</button>
      </div>
    </div>
  </header>

  <main>
    <h1 style="margin-bottom:1.25rem">Каталог товарів</h1>
    <div class="catalog-layout">
      <aside class="filters">
        <h3>Фільтри</h3>
        <form id="filters-form">
          <div class="form-group">
            <label>Категорія</label>
            <select name="category">
              <option value="">Усі</option>
              <option value="Овочі">Овочі</option>
              <option value="Фрукти">Фрукти</option>
              <option value="Ягоди">Ягоди</option>
              <option value="Молочні">Молочні</option>
              <option value="Бакалія">Бакалія</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ціна від</label>
            <input type="number" name="minPrice" min="0" placeholder="0">
          </div>
          <div class="form-group">
            <label>Ціна до</label>
            <input type="number" name="maxPrice" min="0" placeholder="500">
          </div>
          <div class="form-group">
            <label>Сертифікат</label>
            <select name="certificate">
              <option value="">Усі</option>
              <option value="Органік">Органік</option>
              <option value="Еко">Еко</option>
            </select>
          </div>
          <div class="form-group">
            <label>Сортування</label>
            <select name="sort">
              <option value="popular">Популярність</option>
              <option value="price_asc">Дешевші</option>
              <option value="price_desc">Дорожчі</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Застосувати</button>
          <button type="button" class="btn btn-outline btn-block" data-reset style="margin-top:0.5rem">Скинути</button>
        </form>
      </aside>
      <div>
        <p id="products-count" style="margin-bottom:1rem;color:var(--text-secondary)"></p>
        <div class="product-grid" id="product-grid">
          <p>Завантаження...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2026 EcoFresh</div>
  </footer>
  <script src="/js/main.js"></script>
</body>
</html>
