<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дякуємо! — EcoFresh</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Eco<span>Fresh</span></a>
      <nav class="nav">
        <a href="/">Головна</a>
        <a href="/catalog.html">Каталог</a>
        <a href="/account.html">Кабінет</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" onclick="location.href='/cart.html'">🛒 <span class="cart-badge" style="display:none">0</span></button>
        <button class="user-btn">👤</button>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-card" style="max-width:480px;margin:3rem auto;text-align:center">
      <div style="font-size:3rem;margin-bottom:1rem">✅</div>
      <h1>Дякуємо за замовлення!</h1>
      <p id="order-info" style="margin:1rem 0;color:var(--text-secondary)"></p>
      <p>Ми надішлемо підтвердження на email і повідомимо про статус доставки.</p>
      <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">
        <a href="/account.html" class="btn btn-primary">До кабінету</a>
        <a href="/catalog.html" class="btn btn-outline">Продовжити покупки</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2026 EcoFresh</div>
  </footer>
  <script src="/js/main.js"></script>
</body>
</html>
